version: "3.8"

services:
  aware-control-tower:
    build:
      context: .
      dockerfile: Dockerfile
    image: aware-ai:latest
    container_name: aware_ai_control_tower
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - APP_NAME=AWARE-AI
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=sqlite:////app/data/aware_ai.db
      - LOG_LEVEL=INFO
    volumes:
      - aware_data:/app/data
      - aware_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  aware_data:
    driver: local
  aware_logs:
    driver: local
